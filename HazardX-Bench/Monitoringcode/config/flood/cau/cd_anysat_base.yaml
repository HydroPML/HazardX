task: cd
num_classes: 2
ignore_index: 255
seed: 42
model:
  name: anysat
  kwargs:
    in_channels: 8
    num_classes: 2
    model_size: base
    pretrained_backbone: true
    checkpoint_path: /root/autodl-tmp/pretrained_weight/AnySat.pth
    decoder_channels: 256
    patch_size: 16
dataset:
  name: cau_flood
  train:
    dataset_path: /root/autodl-tmp/CAU_Flood
    data_list_path: /root/autodl-tmp/CAU_Flood/train.txt
    split: train
  val:
    dataset_path: /root/autodl-tmp/CAU_Flood
    data_list_path: /root/autodl-tmp/CAU_Flood/validation.txt
    split: val
  test:
    dataset_path: /root/autodl-tmp/CAU_Flood
    data_list_path: /root/autodl-tmp/CAU_Flood/test.txt
    split: test
augmentation:
  train:
    HorizontalFlip:
      p: 0.5
    VerticalFlip:
      p: 0.5
    RandomRotate90:
      p: 1.0
    SmartCrop:
      crop_size: 256
      cat_max_ratio: 0.9
      max_retry: 50
    Normalize:
      pre:
        mean: &id001
        - 0.485
        - 0.456
        - 0.406
        - 0.45
        std: &id002
        - 0.229
        - 0.224
        - 0.225
        - 0.22
        max_pixel_value: 255.0
      post:
        mean:
        - 0.5
        - 0.5
        - 0.5
        - 0.5
        std:
        - 0.25
        - 0.25
        - 0.25
        - 0.25
        max_pixel_value: 255.0
  val:
    Normalize:
      pre:
        mean: *id001
        std: *id002
        max_pixel_value: 255.0
      post:
        mean:
        - 0.5
        - 0.5
        - 0.5
        - 0.5
        std:
        - 0.25
        - 0.25
        - 0.25
        - 0.25
        max_pixel_value: 255.0
optimizer:
  name: AdamW
  learning_rate: 0.0001
  weight_decay: 0.005
scheduler:
  name: CosineAnnealingLR
  step_mode: epoch
  kwargs:
    T_max: 100
loss:
  # The flood class is only 5.8% of the training pixels.  A moderate
  # square-root inverse-frequency weight avoids the all-background solution
  # without the severe over-prediction caused by the full 16.3x ratio.
  class_weights: [1.0, 4.0]
  use_dice: true
  dice_weight: 1.0
  use_lovasz: false
  lovasz_weight: 0.75
training:
  num_epochs: 100
  train_batch_size: 8
  eval_batch_size: 8
  num_workers: 8
  metric_for_best_model: mIoU
output_dir: /root/autodl-tmp/output/cau/cd_anysat_base
