task: seg
num_classes: 2
ignore_index: 255
seed: 42
model:
  name: dofav2
  kwargs:
    in_channels: 14
    num_classes: 2
    variant: large
    img_size: 128
    checkpoint_path: /root/workcsc/DOFA/dofav2_vit_large_e150.pth
    decoder_channels: 256
    head_channels: 256
    wave_list:
    - 0.44
    - 0.49
    - 0.56
    - 0.665
    - 0.705
    - 0.74
    - 0.783
    - 0.832
    - 0.864
    - 0.945
    - 1.373
    - 1.61
    - 2.2
    - 5.405
dataset:
  name: l4s
  train:
    dataset_path: /root/workcsc/datasets/1landslide4sense
    data_list_path: /root/workcsc/AnyDisasterMapping/scripts/data_prep/landslide/Landslide4Sense/train.txt
    crop_size: null
    split: train
  val:
    dataset_path: /root/workcsc/datasets/1landslide4sense
    data_list_path: /root/workcsc/AnyDisasterMapping/scripts/data_prep/landslide/Landslide4Sense/val.txt
    crop_size: null
    split: val
  test:
    dataset_path: /root/workcsc/datasets/1landslide4sense
    data_list_path: /root/workcsc/AnyDisasterMapping/scripts/data_prep/landslide/Landslide4Sense/test.txt
    crop_size: null
    split: test
augmentation:
  train:
    Resize:
      height: 126
      width: 126
  val:
    Resize:
      height: 126
      width: 126
optimizer:
  name: AdamW
  learning_rate: 0.001
  weight_decay: 0.01
scheduler:
  name: StepLR
  step_size: 2000
  gamma: 0.8
training:
  num_epochs: 150
  train_batch_size: 16
  eval_batch_size: 16
  num_workers: 16
  eval_interval: 300
output_dir: ./results/l4s/seg_dofav2_large
