task: seg
num_classes: 2
ignore_index: 255
seed: 42
model:
  name: anysat
  kwargs:
    in_channels: 14
    num_classes: 2
    model_size: base
    pretrained_backbone: true
    checkpoint_path: /root/workcsc/AnyDisasterMapping/pretrained_weight/AnySat.pth
    decoder_channels: 256
    patch_size: 10
    patch_scale: 1
    spatial_resolution: 10.0
    flash_attn: false
    freeze_backbone: false
dataset:
  name: l4s
  train:
    dataset_path: /root/workcsc/datasets/1landslide4sense
    data_list_path: /root/workcsc/AnyDisasterMapping/scripts/data_prep/landslide/Landslide4Sense/train.txt
    crop_size: null
    split: train
  val:
    dataset_path: /root/workcsc/datasets/1landslide4sense
    data_list_path: /root/workcsc/AnyDisasterMapping/scripts/data_prep/landslide/Landslide4Sense/val.txt
    crop_size: null
    split: val
  test:
    dataset_path: /root/workcsc/datasets/1landslide4sense
    data_list_path: /root/workcsc/AnyDisasterMapping/scripts/data_prep/landslide/Landslide4Sense/test.txt
    crop_size: null
    split: test
augmentation:
  train: {}
  val: {}
optimizer:
  name: AdamW
  learning_rate: 5.0e-05
  weight_decay: 0.05
loss:
  # L4S has only about 1.7% landslide pixels. Emphasize the foreground.
  class_weights: [1.0, 10.0]
scheduler:
  name: StepLR
  step_size: 2000
  gamma: 0.8
training:
  num_epochs: 150
  train_batch_size: 32
  eval_batch_size: 32
  num_workers: 16
  eval_interval: 300
output_dir: /root/workcsc/AnyDisasterMapping/output/Landslide4Sense/seg_anysat_base
