task: seg
num_classes: 2
ignore_index: 255
seed: 42
model:
  name: clay
  kwargs:
    in_channels: 14
    num_classes: 2
    backbone: clay-v1.5-large
    # Download Clay v1.5 weights to this location before training.
    checkpoint_path: /root/workcsc/AnyDisasterMapping/pretrained_weight/clay-v1.5.ckpt
    patch_size: 8
    platform: l4s
    gsd: 10.0
    month: 6
    # 12 Sentinel-2 channels, then ALOS PALSAR slope and DEM.
    wavelengths:
    - 0.44
    - 0.49
    - 0.56
    - 0.665
    - 0.705
    - 0.74
    - 0.783
    - 0.832
    - 0.864
    - 0.945
    - 1.373
    - 1.61
    - 2.2
    - 5.405
    hidden_dim: 512
    decoder_channels: 64
    freeze_backbone: true
dataset:
  name: l4s
  train:
    dataset_path: /root/workcsc/datasets/1landslide4sense
    data_list_path: /root/workcsc/AnyDisasterMapping/scripts/data_prep/landslide/Landslide4Sense/train.txt
    crop_size: null
    split: train
  val:
    dataset_path: /root/workcsc/datasets/1landslide4sense
    data_list_path: /root/workcsc/AnyDisasterMapping/scripts/data_prep/landslide/Landslide4Sense/val.txt
    crop_size: null
    split: val
  test:
    dataset_path: /root/workcsc/datasets/1landslide4sense
    data_list_path: /root/workcsc/AnyDisasterMapping/scripts/data_prep/landslide/Landslide4Sense/test.txt
    crop_size: null
    split: test
augmentation:
  train: {}
  val: {}
optimizer:
  name: AdamW
  learning_rate: 5.0e-05
  weight_decay: 0.0001
scheduler:
  name: StepLR
  step_size: 2000
  gamma: 0.8
training:
  num_epochs: 150
  train_batch_size: 32
  eval_batch_size: 32
  num_workers: 16
  eval_interval: 300
output_dir: /root/workcsc/AnyDisasterMapping/output/Landslide4Sense/seg_clay_v15_large
