  name: StepLR
  step_size: 2000
  gamma: 0.8
training:
  num_epochs: 150
  train_batch_size: 16
  eval_batch_size: 16
  num_workers: 4
  eval_interval: 300
output_dir: /root/autodl-tmp/output/LANDREF/seg_sam2fpn_hiera_bp_fpn_legacy
