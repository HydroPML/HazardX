    - 10000
    - 10000
    - 10000
    - 10000
    - 10000
    - 10000
    - 10000
    - 10000
    - 10000
    - 10000
    - 10000
    - 5000
    - 90
    mask_key: None_MASK
  train:
    dataset_path: /root/autodl-tmp/datasetcsc/landslide/LANDREF/reference_data
    h5_path: train_n3_s1s2.h5
    split: train
  val:
    dataset_path: /root/autodl-tmp/datasetcsc/landslide/LANDREF/reference_data
    h5_path: val_n3_s1s2.h5
