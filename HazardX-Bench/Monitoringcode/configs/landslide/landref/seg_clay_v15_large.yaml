    - 10000
    - 10000
    - 10000
    - 10000
    - 10000
    - 10000
    - 10000
    - 10000
    - 10000
    - 10000
    - 10000
    - 10000
    - 10000
    - 10000
    - 10000
    - 10000
    - 10000
    - 10000
    mask_key: None_MASK
  train:
    dataset_path: /root/autodl-tmp/datasetcsc/landslide/LANDREF/reference_data
    h5_path: train_n3_s1s2.h5
    split: train
  val:
    dataset_path: /root/autodl-tmp/datasetcsc/landslide/LANDREF/reference_data
    h5_path: val_n3_s1s2.h5
    split: val
  test:
    dataset_path: /root/autodl-tmp/datasetcsc/landslide/LANDREF/reference_data
    h5_path: testind_n3_s1s2.h5
    split: test
augmentation:
  train:
    HorizontalFlip:
      p: 0.5
    VerticalFlip:
      p: 0.5
  val: {}
optimizer:
  name: AdamW
  learning_rate: 5.0e-05
  weight_decay: 0.0001
scheduler:
  name: StepLR
  step_size: 2000
  gamma: 0.8
training:
  num_epochs: 150
  train_batch_size: 16
  eval_batch_size: 16
  num_workers: 4
  eval_interval: 300
output_dir: /root/autodl-tmp/output/LANDREF/seg_clay_v15_large
compatibility_note: Uses only the 20 pre/post Sentinel-2 optical channels; DEM and
  slope are intentionally excluded from wavelength embedding.
