task: seg
num_classes: 2
ignore_index: 255
seed: 42
model:
  name: clay
  kwargs:
    in_channels: 20
    num_classes: 2
    backbone: clay-v1.5-large
    checkpoint_path: /root/autodl-tmp/pretrained_weight/clay-v1.5.ckpt
    patch_size: 8
    platform: landref_s2_bitemporal
    gsd: 10.0
    month: 6
    wavelengths:
