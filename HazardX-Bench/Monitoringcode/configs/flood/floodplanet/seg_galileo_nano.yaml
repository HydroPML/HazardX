# PS spectral metadata assumes native Blue, Green, Red, NIR channel order.
# Galileo requires all S2 band slots: reuse PS visible/NIR channels as proxies.
# These proxies are not measured red-edge/SWIR bands; validate this adaptation.
task: seg
num_classes: 2
ignore_index: 255
seed: 42
model:
  name: galileo
  kwargs:
    in_channels: 4
    num_classes: 2
    backbone: galileo-nano
    checkpoint_path: /root/autodl-tmp/pretrained_weight/Galileo_nano_encoder.pt
    patch_size: 8
    month: 6
    s2_channel_indices:
    - 0
    - 0
    - 1
    - 2
    - 2
    - 2
    - 3
    - 3
    - 3
    - 3
    - 3
    - 3
    s2_band_names:
    - B1
    - B2
    - B3
    - B4
    - B5
    - B6
    - B7
    - B8
    - B8A
    - B9
    - B11
    - B12
    topographic_channel_indices: null
    decoder_channels: 256
    head_channels: 256
    freeze_backbone: false
dataset:
  name: floodplanet
  train:
    dataset_path: /root/autodl-tmp/datasetcsc/flood/FloodPlanet
    data_list_path: /root/autodl-tmp/datasetcsc/flood/FloodPlanet/train.txt
    split: train
    sensor: PS
    channels:
    - 0
    - 1
    - 2
    - 3
    scale: 10000.0
  val:
    dataset_path: /root/autodl-tmp/datasetcsc/flood/FloodPlanet
    data_list_path: /root/autodl-tmp/datasetcsc/flood/FloodPlanet/validation.txt
    split: val
    sensor: PS
    channels:
    - 0
    - 1
    - 2
    - 3
    scale: 10000.0
  test:
    dataset_path: /root/autodl-tmp/datasetcsc/flood/FloodPlanet
    data_list_path: /root/autodl-tmp/datasetcsc/flood/FloodPlanet/test.txt
    split: test
    sensor: PS
    channels:
    - 0
    - 1
    - 2
    - 3
    scale: 10000.0
augmentation:
  train:
    HorizontalFlip:
      p: 0.5
    VerticalFlip:
      p: 0.5
    RandomRotate90:
      p: 1.0
    RandomCrop:
      height: 256
      width: 256
    Normalize:
      mean:
      - 0.5
      - 0.5
      - 0.5
      - 0.5
      std:
      - 0.5
      - 0.5
      - 0.5
      - 0.5
      max_pixel_value: 1.0
  val:
    CenterCrop:
      height: 256
      width: 256
    Normalize:
      mean:
      - 0.5
      - 0.5
      - 0.5
      - 0.5
      std:
      - 0.5
      - 0.5
      - 0.5
      - 0.5
      max_pixel_value: 1.0
optimizer:
  name: AdamW
  learning_rate: 0.0001
  weight_decay: 0.005
scheduler:
  name: CosineAnnealingLR
  step_mode: epoch
  kwargs:
    T_max: 100
loss:
  use_lovasz: false
  lovasz_weight: 0.75
training:
  num_epochs: 100
  train_batch_size: 8
  eval_batch_size: 1
  num_workers: 4
  metric_for_best_model: mIoU
output_dir: ./results/flood/floodplanet/seg_galileo_nano
